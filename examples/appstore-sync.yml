name: App Store Metadata & Screenshots Sync

on:
  pull_request:
    paths:
      - "appstore/**"
      - "**.storekit"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (read-only diff, zero API mutations)"
        type: boolean
        default: true
      sync_availability:
        description: "Sync app availability (app-level, immediate effect)"
        type: boolean
        default: false
      sync_pricing:
        description: "Sync app price schedule (app-level, immediate effect)"
        type: boolean
        default: false
      sync_iap:
        description: "Sync in-app purchases (IAP pricing takes effect immediately)"
        type: boolean
        default: false
      sync_screenshots:
        description: "Upload framed app & IAP review screenshots"
        type: boolean
        default: false
      allow_live_changes:
        description: "Allow immediate app-level changes (availability/pricing) on a live app"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ios-ci-apps/ios-appstore-sync@<full-40-char-commit-sha>
        with:
          mode: validate
          metadata-path: appstore/metadata.json

  frame:
    name: Frame screenshots & build contact sheet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install CJK fonts for localized headlines
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - uses: ios-ci-apps/ios-appstore-sync@<full-40-char-commit-sha>
        with:
          mode: frame
          screenshots-config-path: appstore/screenshots.json
          raw-screenshots-dir: appstore/raw-screenshots
          output-dir: appstore/framed-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framed-screenshots
          path: appstore/framed-screenshots

  sync:
    name: Sync App Store Connect draft
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, frame]
    runs-on: ubuntu-latest
    environment: appstore-connect
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: framed-screenshots
          path: appstore/framed-screenshots
      - uses: ios-ci-apps/ios-appstore-sync@<full-40-char-commit-sha>
        with:
          mode: sync
          metadata-path: appstore/metadata.json
          output-dir: appstore/framed-screenshots
          dry-run: ${{ inputs.dry_run }}
          sync-availability: ${{ inputs.sync_availability }}
          sync-pricing: ${{ inputs.sync_pricing }}
          sync-iap: ${{ inputs.sync_iap }}
          sync-screenshots: ${{ inputs.sync_screenshots }}
          allow-live-changes: ${{ inputs.allow_live_changes }}
          api-key-id: ${{ vars.ASC_KEY_ID }}
          api-issuer-id: ${{ vars.ASC_ISSUER_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}

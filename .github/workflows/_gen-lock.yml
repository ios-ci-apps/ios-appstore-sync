name: Generate requirements.lock (temporary)

on:
  push:
    branches: [feat/5-hash-locked-deps]
    paths:
      - ".github/workflows/_gen-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"

      - name: Compile universal hash-locked requirements.lock
        run: |
          uv pip compile \
            --universal \
            --generate-hashes \
            --python-version 3.12 \
            --no-emit-package ios-appstore-sync \
            pyproject.toml \
            -o requirements.lock

      - name: Commit requirements.lock and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_gen-lock.yml
          git add requirements.lock
          git commit -m "chore: Generate universal hash-locked requirements.lock"
          git push

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and validate examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: No self-hosted runners in this repository
        run: |
          if grep -rnE '^[[:space:]]*(runs-on:.*|-[[:space:]]*)self-hosted' .github/workflows/; then
            echo "::error::Workflows in this repository must run on GitHub-hosted runners only."
            exit 1
          fi

      - name: Install Noto CJK fonts for screenshot typography tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Verify YAML files parse
        run: |
          python -c "import yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in ('action.yml', 'examples/appstore-sync.yml', '.github/workflows/ci.yml')]"

      - name: Run pytest
        run: pytest -v

      - name: Validate example metadata configs
        run: |
          ios-appstore-sync validate --metadata examples/free-tipjar-metadata.json
          ios-appstore-sync validate --metadata examples/paid-upfront-metadata.json
          ios-appstore-sync validate --metadata examples/pro-unlock-metadata.json

  action-smoke:
    name: Composite action hash-locked install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run composite action (validate mode)
        uses: ./
        with:
          mode: validate
          metadata-path: examples/free-tipjar-metadata.json

      - name: Verify locked runtime imports inside action venv
        shell: bash
        run: |
          "${RUNNER_TEMP}/ios-appstore-sync-venv/bin/python" -c "import jwt, cryptography, PIL; print('LOCKED IMPORTS OK')"

name: iOS App Store Sync
description: Validate and idempotently sync App Store Connect draft metadata, availability, pricing, and in-app purchases on Linux.

inputs:
  mode:
    description: Operation mode ("validate" or "sync").
    required: true
    default: "validate"
  metadata-path:
    description: Path to declarative metadata.json (schema v1).
    required: true
  dry-run:
    description: When "true" (default), sync performs read-only diffing and issues zero mutating API requests.
    default: "true"
  sync-availability:
    description: Set to "true" to sync appAvailabilities v2 when availability is configured.
    default: "false"
  sync-pricing:
    description: Set to "true" to sync appPriceSchedules when appPricing is configured.
    default: "false"
  sync-iap:
    description: Set to "true" to sync inAppPurchases v2, localizations, and price schedules.
    default: "false"
  api-key-id:
    description: App Store Connect API Key ID (required for mode "sync").
    default: ""
  api-issuer-id:
    description: App Store Connect API Issuer ID (required for mode "sync").
    default: ""
  api-private-key:
    description: Contents of the App Store Connect .p8 private key (pass from an environment secret).
    default: ""
  api-key-path:
    description: Path to the .p8 file on the runner, when kept on disk instead of in a secret.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python environment
      shell: bash
      run: |
        set -euo pipefail
        venv_dir="${RUNNER_TEMP:-/tmp}/ios-appstore-sync-venv"
        if [[ ! -x "$venv_dir/bin/ios-appstore-sync" ]]; then
          python3 -m venv "$venv_dir"
          "$venv_dir/bin/pip" install --quiet --upgrade pip
          "$venv_dir/bin/pip" install --quiet "$GITHUB_ACTION_PATH"
        fi

    - name: Run ios-appstore-sync
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_METADATA_PATH: ${{ inputs.metadata-path }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_SYNC_AVAILABILITY: ${{ inputs.sync-availability }}
        INPUT_SYNC_PRICING: ${{ inputs.sync-pricing }}
        INPUT_SYNC_IAP: ${{ inputs.sync-iap }}
        ASC_KEY_ID: ${{ inputs.api-key-id }}
        ASC_ISSUER_ID: ${{ inputs.api-issuer-id }}
        ASC_PRIVATE_KEY: ${{ inputs.api-private-key }}
        ASC_KEY_PATH: ${{ inputs.api-key-path }}
      run: |
        set -euo pipefail
        cli="${RUNNER_TEMP:-/tmp}/ios-appstore-sync-venv/bin/ios-appstore-sync"

        case "$INPUT_MODE" in
          validate)
            unset ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY ASC_KEY_PATH
            "$cli" validate --metadata "$INPUT_METADATA_PATH"
            ;;
          sync)
            args=(--metadata "$INPUT_METADATA_PATH" --dry-run "$INPUT_DRY_RUN")
            [[ "${INPUT_SYNC_AVAILABILITY,,}" == "true" ]] && args+=(--sync-availability)
            [[ "${INPUT_SYNC_PRICING,,}" == "true" ]] && args+=(--sync-pricing)
            [[ "${INPUT_SYNC_IAP,,}" == "true" ]] && args+=(--sync-iap)
            "$cli" sync "${args[@]}"
            ;;
          *)
            echo "::error::Unsupported mode '$INPUT_MODE'. Expected 'validate' or 'sync'."
            exit 1
            ;;
        esac

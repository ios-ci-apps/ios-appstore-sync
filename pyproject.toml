[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-appstore-sync"
version = "0.1.0"
description = "Reusable CLI and GitHub Action to validate and idempotently sync App Store Connect drafts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "PyJWT>=2.8,<3",
    "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "PyYAML>=6,<7",
]

[project.scripts]
ios-appstore-sync = "ios_appstore_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
